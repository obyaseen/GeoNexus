            border: 1px solid #142847;
            box-shadow: 0 0 25px rgba(0, 10, 30, 0.85);
            position: relative;
        }

        .hud-bracket-tr { position: absolute; top: 0; right: 0; width: 8px; height: 8px; border-top: 2px solid #00d2ff; border-right: 2px solid #00d2ff; pointer-events: none; }
        .hud-bracket-bl { position: absolute; bottom: 0; left: 0; width: 8px; height: 8px; border-bottom: 2px solid #00d2ff; border-left: 2px solid #00d2ff; pointer-events: none; }
        .hud-bracket-br { position: absolute; bottom: 0; right: 0; width: 8px; height: 8px; border-bottom: 2px solid #00d2ff; border-right: 2px solid #00d2ff; pointer-events: none; }

        .neon-text-allied { text-shadow: 0 0 10px rgba(0, 250, 154, 0.85); }

        .scanlines {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.25) 50%, rgba(0,0,0,0.25));
            background-size: 100% 4px;
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 20;
            opacity: 0.35;
            mix-blend-mode: overlay;
        }

        .vignette-overlay {
            background: radial-gradient(circle, rgba(0,0,0,0) 45%, rgba(2,5,10,0.95) 100%);
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 20;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #142847; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #00d2ff; }

        .mask-bottom-fade {
            mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
        }

        .cyber-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border: 1px solid #142847;
            background: rgba(2, 5, 10, 0.6);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: all 0.15s ease;
        }
        .cyber-checkbox:checked {
            background: rgba(0, 210, 255, 0.25);
            border-color: #00d2ff;
        }
        .cyber-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 4px;
            top: 1px;
            width: 4px;
            height: 7px;
            border-right: 2px solid #00d2ff;
            border-bottom: 2px solid #00d2ff;
            transform: rotate(45deg);
        }

        @keyframes dash-flow {
            to { stroke-dashoffset: -40; }
        }
        .animate-data-flow {
            animation: dash-flow 1.8s linear infinite;
        }

        @keyframes radar-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-radar-sweep {
            transform-origin: center;
            animation: radar-spin 4s linear infinite;
        }
    </style>

        const RadarChart = ({ data }) => {
            const size = 140;
            const center = size / 2;
            const radius = (size / 2) - 22;
            const axes = Object.keys(data);
            const angleStep = (Math.PI * 2) / axes.length;

            const getPoint = (value, index) => {
                const angle = index * angleStep - Math.PI / 2;
                const r = (value / 100) * radius;
                return { x: center + r * Math.cos(angle), y: center + r * Math.sin(angle) };
            };

            const pathData = axes.map((axis, i) => {
                const pt = getPoint(data[axis].value, i);
                return `${i === 0 ? 'M' : 'L'} ${pt.x},${pt.y}`;
            }).join(' ') + ' Z';

            return (
                <div className="relative w-full flex justify-center items-center py-1">
                    <svg width={size} height={size} className="overflow-visible">
                        {[0.33, 0.66, 1].map(scale => (
                            <polygon key={scale}
                                points={axes.map((_, i) => `${getPoint(scale * 100, i).x},${getPoint(scale * 100, i).y}`).join(' ')}
                                fill={scale === 1 ? "rgba(0, 210, 255, 0.05)" : "none"} 
                                stroke="#142847" strokeWidth="1" strokeDasharray={scale < 1 ? "2 2" : "none"}
                            />
                        ))}
                        {axes.map((axis, i) => {
                            const end = getPoint(100, i);
                            return <line key={`line-${i}`} x1={center} y1={center} x2={end.x} y2={end.y} stroke="#142847" strokeWidth="1" />;
                        })}
                        <path d={pathData} fill="rgba(0, 210, 255, 0.25)" stroke="#00d2ff" strokeWidth="1.5" />
                        {axes.map((axis, i) => {
                            const labelPt = getPoint(122, i);
                            return (
                                <text key={`lbl-${i}`} x={labelPt.x} y={labelPt.y} textAnchor="middle" alignmentBaseline="middle" fill="#768ba5" fontSize="7.5" className="uppercase font-mono">
                                    {axis}
                                </text>
                            );
                        })}
                    </svg>
                </div>
            );
        };

        const IntelligenceSidebar = () => {
            const { selectedCountryId, setSelectedCountryId, activeFilters, isMobile } = useGlobalState();
            const scrollRef = useRef(null);

            const sidebarClasses = isMobile
                ? "absolute bottom-0 left-0 right-0 h-[55vh] rounded-t-lg"
                : "absolute top-16 right-4 w-[360px] max-h-[calc(100vh-5.5rem)] rounded-sm";

            if (selectedCountryId) {
                const country = globalNations.find(n => n.iso3 === selectedCountryId);
                if (!country) return null;

                const relations = allGlobalRelations
                    .filter(r => r.source === country.iso3 || r.target === country.iso3)
                    .sort((a,b) => b.score - a.score);

                return (
                    <div className={`${sidebarClasses} hud-panel flex flex-col overflow-hidden duration-300 z-40 border-l-2 border-intel-accent`}>
                        <HUDCorners />
                        
                        <div className="p-3 border-b border-intel-border relative bg-gradient-to-r from-intel-border/30 to-transparent flex-shrink-0">
                            <div className="flex justify-between items-start">
                                <div>
                                    <h2 className="text-lg font-bold font-mono text-white tracking-widest uppercase">{country.name}</h2>
                                    <div className="text-[9px] text-intel-accent uppercase font-mono">
                                        NODE MATRIX // {relations.length} Active Mutual Pacts
                                    </div>
                                </div>
                                <button onClick={() => setSelectedCountryId(null)} className="text-intel-text hover:text-white p-1 bg-intel-border/20 rounded">
                                    <IconX />
                                </button>
                            </div>
                        </div>

                        <div ref={scrollRef} className="flex-1 overflow-y-auto p-3 space-y-3 mask-bottom-fade">
                            <RadarChart data={country.metrics} />

                            <div className="space-y-2">
                                <div className="text-[9px] font-mono text-intel-accent uppercase tracking-widest border-b border-intel-border pb-1">
                                    DEFENSE & ECONOMIC ALLIANCES ({relations.length})
                                </div>

                                {relations.length === 0 && (
                                    <div className="text-xs font-mono text-intel-text/50 border border-dashed border-intel-border p-4 text-center">
                                        No registered mutual pacts recorded.
                                    </div>
                                )}

                                {relations.map((rel, i) => {
                                    const otherIso = rel.source === country.iso3 ? rel.target : rel.source;
                                    const targetCountry = globalNations.find(n => n.iso3 === otherIso);
                                    if (!targetCountry) return null;

                                    return (
                                        <div 
                                            key={`${rel.source}-${rel.target}-${i}`} 
                                            onClick={() => setSelectedCountryId(targetCountry.iso3)}
                                            className="bg-intel-bg/90 p-2 border border-intel-border/60 border-l-2 border-l-intel-allied font-mono cursor-pointer hover:bg-intel-allied/10 transition-colors rounded-sm"
                                        >
                                            <div className="flex justify-between items-center mb-1">
                                                <div className="flex items-center gap-1.5">
                                                    <IconCheckCircle className="text-intel-allied" />
                                                    <span className="font-bold text-xs text-white uppercase">{targetCountry.name}</span>
                                                    <span className="text-[9px] text-intel-text">({targetCountry.iso3})</span>
                                                </div>
                                                <span className="text-[8px] font-bold text-intel-allied border border-intel-allied/30 px-1 py-0.5 bg-intel-allied/10">
                                                    +{rel.score}
                                                </span>
                                            </div>
                                            
                                            <div className="space-y-0.5 mt-1">
                                                {rel.reasons.map((r, idx) => (
                                                    <div key={idx} className="text-[9px] text-intel-highlight/80 flex items-start gap-1">
                                                        <span className="text-intel-accent">›</span>
                                                        <span className="truncate">{r}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            }

            if (activeFilters.length > 0) {
                const filterMembers = new Set();
                activeFilters.forEach(filter => {
                    BLOCS[filter]?.members.forEach(iso => filterMembers.add(iso));
                });
                
                const memberNations = Array.from(filterMembers).map(iso => globalNations.find(n => n.iso3 === iso)).filter(Boolean);

                return (
                    <div className={`${sidebarClasses} hud-panel flex flex-col overflow-hidden duration-300 z-40 border-l-2 border-intel-accent`}>
                        <HUDCorners />
                        <div className="p-3 border-b border-intel-border relative bg-gradient-to-r from-intel-border/30 to-transparent flex-shrink-0">
                            <h2 className="text-base font-bold font-mono text-white tracking-wider uppercase">ALLIANCE OVERLAY</h2>
                            <div className="text-[9px] text-intel-accent uppercase font-mono">
                                {activeFilters.length} PACTS SELECTED // {memberNations.length} NATIONS
                            </div>
                        </div>

                        <div ref={scrollRef} className="flex-1 overflow-y-auto p-3 space-y-2 mask-bottom-fade">
                            <div className="flex flex-wrap gap-1">
                                {activeFilters.map(f => (
                                    <span key={f} className="text-[8px] font-mono px-1.5 py-0.5 bg-intel-accent/15 border border-intel-accent text-intel-highlight rounded-sm">
                                        {f}
                                    </span>
                                ))}
                            </div>

                            <div className="space-y-1">
                                {memberNations.sort((a,b) => a.name.localeCompare(b.name)).map(nation => (
                                    <div 
                                        key={nation.iso3} 
                                        onClick={() => setSelectedCountryId(nation.iso3)}
                                        className="bg-intel-bg/80 p-1.5 border border-intel-border/50 border-l-2 border-l-intel-allied font-mono cursor-pointer hover:bg-intel-border/40 transition-colors text-[11px] flex justify-between rounded-sm"
                                    >
                                        <span className="text-white font-bold">{nation.name}</span>
                                        <span className="text-intel-text text-[9px]">[{nation.iso3}]</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        };

        const MapEngine = () => {
            const { selectedCountryId, setSelectedCountryId, setHoveredCountryId, activeFilters, isLiteMode, isMobile } = useGlobalState();
            const svgRef = useRef(null);
            const [geoData, setGeoData] = useState(null);
            const [transform, setTransform] = useState(d3.zoomIdentity);
            const [dimensions, setDimensions] = useState({ width: window.innerWidth || 1200, height: window.innerHeight || 800 });

            useEffect(() => {
                const handleResize = () => setDimensions({ width: window.innerWidth, height: window.innerHeight });
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const projection = useMemo(() => {
                const scale = isMobile ? dimensions.width / 1.3 / Math.PI : (dimensions.width / 2 / Math.PI) * 1.35;
                const yOffset = isMobile ? -30 : 40;
                return d3.geoMercator()
                  .scale(scale)
                  .translate([dimensions.width / 2, dimensions.height / 2 + yOffset]);
            }, [dimensions, isMobile]);

            const pathGenerator = useMemo(() => d3.geoPath().projection(projection), [projection]);

            // --- COLLISION RELAXATION SOLVER ---
            // Resolves overlapping micro-states and dense nation clusters without losing geographic anchor
            const nodePositions = useMemo(() => {
                const nodes = globalNations.map(nation => {
                    const p = projection(nation.coordinates) || [0, 0];
                    return {
                        iso3: nation.iso3,
                        origX: p[0],
                        origY: p[1],
                        x: p[0],
                        y: p[1]
                    };
                });

                const minDist = isMobile ? 8.5 : 11;
                const minDistSq = minDist * minDist;
                const iterations = 35;

                for (let iter = 0; iter < iterations; iter++) {
                    for (let i = 0; i < nodes.length; i++) {
                        for (let j = i + 1; j < nodes.length; j++) {
                            const a = nodes[i];
                            const b = nodes[j];
                            const dx = b.x - a.x;
                            const dy = b.y - a.y;
                            let distSq = dx * dx + dy * dy;

                            if (distSq < minDistSq) {
                                let dist = Math.sqrt(distSq);
                                if (dist < 0.001) {
                                    b.x += 1;
                                    b.y += 0.5;
                                    dist = 1.118;
                                }
                                const overlap = (minDist - dist) * 0.5;
                                const nx = (dx / dist) * overlap;
                                const ny = (dy / dist) * overlap;
                                a.x -= nx;
                                a.y -= ny;
                                b.x += nx;
                                b.y += ny;
                            }
                        }
                    }
                    // Gentle spring tether to physical geographical center
                    for (let i = 0; i < nodes.length; i++) {
                        const n = nodes[i];
                        n.x += (n.origX - n.x) * 0.08;
                        n.y += (n.origY - n.y) * 0.08;
                    }
                }

                const posMap = new Map();
                nodes.forEach(n => {
                    posMap.set(n.iso3, {
                        origX: n.origX,
                        origY: n.origY,
                        repelledX: n.x,
                        repelledY: n.y
                    });
                });
                return posMap;
            }, [projection, isMobile]);

            // Dynamic zoom-aware interpolation: repelled at k=1, converging to exact coordinates at high zoom
            const getNodeRenderPos = (iso3) => {
                const data = nodePositions.get(iso3);
                if (!data) return { x: 0, y: 0, origX: 0, origY: 0, isOffset: false };
                const factor = Math.max(0, Math.min(1, 1 - (transform.k - 1) / 3.5));
                const currentX = data.origX + (data.repelledX - data.origX) * factor;
                const currentY = data.origY + (data.repelledY - data.origY) * factor;
                const offsetDistance = Math.hypot(data.repelledX - data.origX, data.repelledY - data.origY);
                return {
                    x: currentX,
                    y: currentY,
                    origX: data.origX,
                    origY: data.origY,
                    isOffset: factor > 0.08 && offsetDistance > 2.5
                };
            };

            useEffect(() => {
                if (!svgRef.current) return;
                const svg = d3.select(svgRef.current);
                const zoom = d3.zoom()
                    .scaleExtent([0.8, 40])
                    .on('zoom', (e) => setTransform(e.transform));
                svg.call(zoom);
            }, []);

            useEffect(() => {
                fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.objects && data.objects.countries) {
                            setGeoData(topojson.feature(data, data.objects.countries).features);
                        }
                    })
                    .catch(err => console.error("Map topology load error", err));
            }, []);

            const filterMembersSet = useMemo(() => {
                const set = new Set();
                activeFilters.forEach(filter => {
                    BLOCS[filter]?.members.forEach(iso => set.add(iso));
                });
                return set;
            }, [activeFilters]);

            const arcs = useMemo(() => {
                let relationsToDraw = [];
                
                if (selectedCountryId) {
                    relationsToDraw = allGlobalRelations
                        .filter(r => r.source === selectedCountryId || r.target === selectedCountryId);
                } else if (activeFilters.length > 0) {
                    relationsToDraw = allGlobalRelations.filter(r => 
                        filterMembersSet.has(r.source) && filterMembersSet.has(r.target)
                    );
                }

                return relationsToDraw.map(rel => {
                    const sourcePos = getNodeRenderPos(rel.source);
                    const targetPos = getNodeRenderPos(rel.target);
                    if (!sourcePos || !targetPos) return null;
                    
                    const p1 = [sourcePos.x, sourcePos.y];
                    const p2 = [targetPos.x, targetPos.y];

                    const dx = p2[0] - p1[0];
                    const dy = p2[1] - p1[1];
                    const dr = Math.sqrt(dx * dx + dy * dy);
                    const cx = (p1[0] + p2[0]) / 2;
                    const cy = (p1[1] + p2[1]) / 2 - Math.min(dr * 0.35, 120); 
                    
                    return { 
                        id: `${rel.source}-${rel.target}`, 
                        path: `M${p1[0]},${p1[1]} Q${cx},${cy} ${p2[0]},${p2[1]}`,
                        score: rel.score
                    };
                }).filter(Boolean);
            }, [selectedCountryId, activeFilters, filterMembersSet, transform.k, nodePositions]);

            return (
                <div 
                    className="absolute inset-0 z-10 bg-intel-bg overflow-hidden cursor-move" 
                    onClick={() => { setSelectedCountryId(null); setHoveredCountryId(null); }}
                >
                    <svg ref={svgRef} width="100%" height="100%" className="absolute inset-0">
                        <defs>
                            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(20, 40, 71, 0.2)" strokeWidth="1"/>
                            </pattern>
                            <filter id="glow-accent"><feGaussianBlur stdDeviation="2" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                        </defs>
                        <rect width="100%" height="100%" fill="url(#grid)" />

                        <g transform={transform.toString()}>
                            {/* Base World TopoJSON */}
                            <g className="map-layer">
                                {geoData && geoData.map((feature, i) => (
                                    <path 
                                        key={`geo-${i}`}
                                        d={pathGenerator(feature)}
                                        fill="#040914"
                                        stroke="#142847"
                                        strokeWidth={Math.max(0.3 / transform.k, 0.05)}
                                    />
                                ))}
                            </g>

                            {/* Active Alliance Arcs */}
                            <g className="arcs-layer">
                                {arcs.map((arc) => (
                                    <g key={arc.id}>
                                        <path
                                            d={arc.path}
                                            fill="none"
                                            stroke="#00fa9a"
                                            strokeWidth={Math.max(0.6 / transform.k, 0.1)}
                                            style={{ opacity: isLiteMode ? 0.45 : 0.3 }}
                                        />
                                        <path
                                            d={arc.path}
                                            fill="none"
                                            stroke="#00d2ff"
                                            strokeWidth={isLiteMode ? Math.max(1.2 / transform.k, 0.2) : Math.max(1.5 / transform.k, 0.25)}
                                            strokeDasharray={isLiteMode ? "none" : `${6/transform.k} ${4/transform.k}`}
                                            className={isLiteMode ? "" : "animate-data-flow"}
                                            style={{
                                                opacity: isLiteMode ? 0.9 : 0.85,
                                                filter: isLiteMode ? "none" : "url(#glow-accent)"
                                            }}
                                        />
                                    </g>
                                ))}
                            </g>

                            {/* Sovereign Nation Nodes */}
                            <g className="nodes-layer">
                                {globalNations.map(nation => {
                                    const pos = getNodeRenderPos(nation.iso3);
                                    if (!pos) return null;
                                    
                                    const isSelected = selectedCountryId === nation.iso3;
                                    let isConnected = false;
                                    let isDimmed = false;

                                    if (selectedCountryId) {
                                        isConnected = isSelected || arcs.some(a => a.id.includes(nation.iso3));
                                        isDimmed = !isConnected;
                                    } else if (activeFilters.length > 0) {
                                        isConnected = filterMembersSet.has(nation.iso3);
                                        isDimmed = !isConnected;
                                    }

                                    const scale = 1 / transform.k;
                                    const visualRadius = isSelected ? Math.max(3.8 * scale, 0.6) : (isConnected ? Math.max(2.2 * scale, 0.35) : Math.max(1.4 * scale, 0.2));
                                    const showText = isSelected || (isConnected && transform.k > 2.2) || transform.k > 4;

                                    return (
                                        <g 
                                            key={nation.iso3} 
                                            transform={`translate(${pos.x}, ${pos.y})`}
                                            onClick={(e) => { 
                                                e.stopPropagation(); 
                                                setSelectedCountryId(nation.iso3 === selectedCountryId ? null : nation.iso3);
                                            }}
                                            onMouseEnter={() => setHoveredCountryId(nation.iso3)}
                                            onMouseLeave={() => setHoveredCountryId(null)}
                                            className={`cursor-pointer transition-opacity duration-300 ${isDimmed ? 'opacity-15' : 'opacity-100'}`}
                                        >
                                            {/* Tactical Leader Whisker for displaced microstates */}
                                            {pos.isOffset && (
                                                <g opacity={isDimmed ? 0.2 : 0.5}>
                                                    <line 
                                                        x1={0} 
                                                        y1={0} 
                                                        x2={pos.origX - pos.x} 
                                                        y2={pos.origY - pos.y} 
                                                        stroke="#00d2ff" 
                                                        strokeWidth={Math.max(0.4 * scale, 0.05)} 
                                                        strokeDasharray={`${2 * scale} ${1.5 * scale}`} 
                                                    />
                                                    <circle 
                                                        cx={pos.origX - pos.x} 
                                                        cy={pos.origY - pos.y} 
                                                        r={Math.max(0.8 * scale, 0.15)} 
                                                        fill="#00d2ff" 
                                                    />
                                                </g>
                                            )}

                                            <circle r={visualRadius * 2.5} fill="transparent" />

                                            {isSelected && !isLiteMode && (
                                                <g transform={`scale(${scale})`}>
                                                    <circle r="14" fill="rgba(0,210,255,0.1)" stroke="#00d2ff" strokeWidth="0.5" strokeDasharray="2 2" className="animate-radar-sweep"/>
                                                </g>
                                            )}
                                            {isSelected && isLiteMode && (
                                                <g transform={`scale(${scale})`}>
                                                    <circle r="12" fill="rgba(0,210,255,0.1)" stroke="#00d2ff" strokeWidth="0.75" />
                                                </g>
                                            )}
                                            
                                            <circle 
                                                r={visualRadius} 
                                                fill={isSelected ? "#00d2ff" : (isConnected ? "#00fa9a" : "#768ba5")} 
                                                filter={(!isLiteMode && (isSelected || isConnected)) ? "url(#glow-accent)" : ""}
                                            />
                                            
                                            <text 
                                                y={-4 * scale - visualRadius} 
                                                textAnchor="middle" 
                                                fill={isSelected ? "#00d2ff" : (isConnected ? "#00fa9a" : "#4a5568")}
                                                fontSize={Math.max(5 * scale, 0.6)}
                                                className="font-mono font-bold select-none pointer-events-none"
                                                style={{ opacity: showText ? 1 : 0 }}
                                            >
                                                {nation.iso3}
                                            </text>
                                        </g>
                                    );
                                })}
                            </g>
                        </g>
                    </svg>

                    <div className="vignette-overlay"></div>
                    <div className="scanlines"></div>
                </div>
            );
        };

        const App = () => {
            const [isBooting, setIsBooting] = useState(true);

            return (
                <GlobalStateProvider>
                    {isBooting ? (
                        <BootSequence onComplete={() => setIsBooting(false)} />
                    ) : (
                        <>
                            <TopNav />
                            <GlobalTreatyFilter />
                            <CyberTargetReadout />
                            <MapEngine />
                            <IntelligenceSidebar />
                        </>
                    )}
                </GlobalStateProvider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
