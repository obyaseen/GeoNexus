    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #02050a; }

        .hud-panel {
            background-color: rgba(6, 13, 26, 0.95);
            border: 1px solid #142847;
            position: relative;
        }

        .hud-bracket-tl { position: absolute; top: 0; left: 0; width: 8px; height: 8px; border-top: 2px solid #00d2ff; border-left: 2px solid #00d2ff; pointer-events: none; }
        .hud-bracket-tr { position: absolute; top: 0; right: 0; width: 8px; height: 8px; border-top: 2px solid #00d2ff; border-right: 2px solid #00d2ff; pointer-events: none; }
        .hud-bracket-bl { position: absolute; bottom: 0; left: 0; width: 8px; height: 8px; border-bottom: 2px solid #00d2ff; border-left: 2px solid #00d2ff; pointer-events: none; }
        .hud-bracket-br { position: absolute; bottom: 0; right: 0; width: 8px; height: 8px; border-bottom: 2px solid #00d2ff; border-right: 2px solid #00d2ff; pointer-events: none; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #142847; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #00d2ff; }

        .mask-bottom-fade {
            mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
        }

        .cyber-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border: 1px solid #142847;
            background: rgba(2, 5, 10, 0.6);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: all 0.1s ease;
        }
        .cyber-checkbox:checked {
            background: rgba(0, 210, 255, 0.25);
            border-color: #00d2ff;
        }
        .cyber-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 4px;
            top: 1px;
            width: 4px;
            height: 7px;
            border-right: 2px solid #00d2ff;
            border-bottom: 2px solid #00d2ff;
            transform: rotate(45deg);
        }

        /* 
         * Hardware-Accelerated Data Flow 
         * Uses non-scaling-stroke so pixels remain exact during zooming 
         */
        @keyframes dash-flow {
            to { stroke-dashoffset: -32; }
        }
        .arc-flow-active {
            stroke-dasharray: 4 6;
            animation: dash-flow 1.2s linear infinite;
            vector-effect: non-scaling-stroke;
        }
        .arc-flow-static {
            vector-effect: non-scaling-stroke;
        }

        .map-vector {
            vector-effect: non-scaling-stroke;
        }

        /* 
         * ZERO-LAG INVERSE SCALING ENGINE 
         * This uses a CSS variable (--inv-k) injected dynamically by D3. 
         * It shrinks nodes exactly as the map zooms in, bypassing React completely!
         */
        #map-svg {
            --inv-k: 1;
        }
        .node-scaler {
            transform: scale(var(--inv-k));
            will-change: transform;
        }
    </style>

        const CyberTargetReadout = () => {

        const RadarChart = ({ data }) => {
            const size = 140;
            const center = size / 2;
            const radius = (size / 2) - 22;
            const axes = Object.keys(data);
            const angleStep = (Math.PI * 2) / axes.length;

            const getPoint = (value, index) => {
                const angle = index * angleStep - Math.PI / 2;
                const r = (value / 100) * radius;
                return { x: center + r * Math.cos(angle), y: center + r * Math.sin(angle) };
            };

            const pathData = axes.map((axis, i) => {
                const pt = getPoint(data[axis].value, i);
                return `${i === 0 ? 'M' : 'L'} ${pt.x},${pt.y}`;
            }).join(' ') + ' Z';

            return (
                <div className="relative w-full flex justify-center items-center py-1">
                    <svg width={size} height={size} className="overflow-visible">
                        {[0.33, 0.66, 1].map(scale => (
                            <polygon key={scale}
                                points={axes.map((_, i) => `${getPoint(scale * 100, i).x},${getPoint(scale * 100, i).y}`).join(' ')}
                                fill={scale === 1 ? "rgba(0, 210, 255, 0.05)" : "none"} 
                                stroke="#142847" strokeWidth="1" strokeDasharray={scale < 1 ? "2 2" : "none"}
                            />
                        ))}
                        {axes.map((axis, i) => {
                            const end = getPoint(100, i);
                            return <line key={`line-${i}`} x1={center} y1={center} x2={end.x} y2={end.y} stroke="#142847" strokeWidth="1" />;
                        })}
                        <path d={pathData} fill="rgba(0, 210, 255, 0.2)" stroke="#00d2ff" strokeWidth="1.5" />
                        {axes.map((axis, i) => {
                            const labelPt = getPoint(120, i);
                            return (
                                <text key={`lbl-${i}`} x={labelPt.x} y={labelPt.y} textAnchor="middle" alignmentBaseline="middle" fill="#768ba5" fontSize="7.5" className="uppercase font-mono">

        const IntelligenceSidebar = () => {

                                )}

                                {relations.map((rel, i) => (
                                    <div 
                                        key={`${rel.source}-${rel.target}-${i}`}

                                    >
                                        <div className="flex items-center gap-1.5 mb-1">
                                            <IconCheckCircle />

                                            <span className="text-[9px] text-intel-text">({rel.targetCountry.iso3})</span>
                                        </div>
                                        
                                        <div className="space-y-0.5 mt-1">
                                            {rel.reasons.map((r, idx) => (
                                                <div key={idx} className="text-[9px] text-intel-highlight flex items-start gap-1">
                                                    <span className="text-intel-accent">›</span>

                                                </div>
                                            ))}

                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            if (activeFilters.length > 0) {
                const filterMembers = new Set();
                activeFilters.forEach(filter => {
                    BLOCS[filter]?.members.forEach(iso => filterMembers.add(iso));
                });
                
                const memberNations = Array.from(filterMembers).map(iso => globalNations.find(n => n.iso3 === iso)).filter(Boolean);

                return (
                    <div className={`${sidebarClasses} hud-panel flex flex-col overflow-hidden z-40 border-l-2 border-intel-accent`}>
                        <HUDCorners />
                        <div className="p-3 border-b border-intel-border relative bg-intel-border/20 flex-shrink-0">
                            <h2 className="text-base font-bold font-mono text-white tracking-wider uppercase">ACTIVE ACCORD OVERLAY</h2>
                            <div className="text-[9px] text-intel-accent uppercase font-mono">
                                {activeFilters.length} ACCORDS ACTIVE // {memberNations.length} PARTICIPANTS
                            </div>
                        </div>

                        <div ref={scrollRef} className="flex-1 overflow-y-auto p-3 space-y-2">
                            <div className="flex flex-wrap gap-1">
                                {activeFilters.map(f => (
                                    <span key={f} className="text-[8px] font-mono px-1.5 py-0.5 bg-intel-accent/15 border border-intel-accent text-intel-highlight rounded-sm">
                                        {f}
                                    </span>
                                ))}
                            </div>

                            <div className="space-y-1">
                                {memberNations.sort((a,b) => a.name.localeCompare(b.name)).map(nation => (
                                    <div 
                                        key={nation.iso3} 
                                        onClick={() => setSelectedCountryId(nation.iso3)}

                                    >
                                        <span className="text-white font-bold">{nation.name}</span>
                                        <span className="text-intel-text text-[9px]">[{nation.iso3}]</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        };

        // --- MAP ENGINE: ZERO-LAG GPU SCALING ---
        const MapEngine = () => {
            const { selectedCountryId, setSelectedCountryId, setHoveredCountryId, activeFilters, isAnimActive, isMobile } = useGlobalState();
            const svgRef = useRef(null);
            const zoomGroupRef = useRef(null);
            
            const [geoPathStr, setGeoPathStr] = useState("");
            const [bordersPathStr, setBordersPathStr] = useState("");
            const [dimensions, setDimensions] = useState({ width: window.innerWidth || 1200, height: window.innerHeight || 800 });

            // Handle window resizing
            useEffect(() => {
                const handleResize = () => setDimensions({ width: window.innerWidth, height: window.innerHeight });
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            // Natural Mercator Projection covering the whole world
            const baseProjection = useMemo(() => {
                const scale = isMobile ? (dimensions.width / 2 / Math.PI) * 1.15 : (dimensions.width / 2 / Math.PI) * 1.35;
                const yOffset = isMobile ? -15 : 25;
                return d3.geoMercator()
                    .scale(scale)
                    .translate([dimensions.width / 2, dimensions.height / 2 + yOffset]);
            }, [dimensions, isMobile]);

            // Memoize the SVG path strings for the map so React NEVER recalculates them
            useEffect(() => {
                const pathGen = d3.geoPath().projection(baseProjection);

                const fetchMap = async () => {
                    try {
                        const res = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json');
                        const data = await res.json();
                        if (data?.objects?.countries) {
                            const feat = topojson.feature(data, data.objects.countries);
                            const borders = topojson.mesh(data, data.objects.countries, (a, b) => a !== b);
                            setGeoPathStr(pathGen(feat));
                            setBordersPathStr(pathGen(borders));
                        }
                    } catch (e) {
                        const res2 = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json');
                        const data2 = await res2.json();
                        if (data2?.objects?.countries) {
                            const feat2 = topojson.feature(data2, data2.objects.countries);
                            const borders2 = topojson.mesh(data2, data2.objects.countries, (a, b) => a !== b);
                            setGeoPathStr(pathGen(feat2));
                            setBordersPathStr(pathGen(borders2));
                        }
                    }
                };

                fetchMap();
            }, [baseProjection]);

            // Pre-calculate positions for all sovereign nodes
            const nodeBasePositions = useMemo(() => {
                const map = new Map();
                globalNations.forEach(n => {
                    const p = baseProjection(n.coordinates);
                    if (p) {
                        map.set(n.iso3, { x: p[0], y: p[1] });
                    }
                });
                return map;
            }, [baseProjection]);

            // DIRECT D3 HARDWARE ACCELERATION
            // Bypasses React state completely during dragging and scrolling to ensure a perfectly locked 60 FPS
            useEffect(() => {
                if (!svgRef.current || !zoomGroupRef.current) return;
                const svg = d3.select(svgRef.current);
                const g = d3.select(zoomGroupRef.current);

                const zoom = d3.zoom()
                    .scaleExtent([0.8, 40])
                    .on('zoom', (event) => {
                        // 1. Move the map matrix directly
                        g.attr('transform', event.transform);
                        
                        // 2. Inject inverse scale CSS Variable so nodes auto-shrink while hitboxes stay large
                        svgRef.current.style.setProperty('--inv-k', 1 / event.transform.k);
                    });

                svg.call(zoom);
            }, []);

            const filterMembersSet = useMemo(() => {
                const set = new Set();
                activeFilters.forEach(filter => {
                    BLOCS[filter]?.members.forEach(iso => set.add(iso));
                });
                return set;
            }, [activeFilters]);

            // Map the active treaty connection arcs
            const arcs = useMemo(() => {
                let relationsToDraw = [];
                
                if (selectedCountryId) {
                    relationsToDraw = allGlobalRelations
                        .filter(r => r.source === selectedCountryId || r.target === selectedCountryId);
                } else if (activeFilters.length > 0) {
                    relationsToDraw = allGlobalRelations.filter(r => 
                        filterMembersSet.has(r.source) && filterMembersSet.has(r.target)
                    );
                }

                return relationsToDraw.map(rel => {
                    const sourcePos = nodeBasePositions.get(rel.source);
                    const targetPos = nodeBasePositions.get(rel.target);
                    if (!sourcePos || !targetPos) return null;
                    
                    const p1 = [sourcePos.x, sourcePos.y];
                    const p2 = [targetPos.x, targetPos.y];

                    const dx = p2[0] - p1[0];
                    const dy = p2[1] - p1[1];
                    const dr = Math.sqrt(dx * dx + dy * dy);
                    const cx = (p1[0] + p2[0]) / 2;
                    const cy = (p1[1] + p2[1]) / 2 - Math.min(dr * 0.35, 120); 
                    
                    return { 
                        id: `${rel.source}-${rel.target}`, 
                        path: `M${p1[0]},${p1[1]} Q${cx},${cy} ${p2[0]},${p2[1]}`
                    };
                }).filter(Boolean);
            }, [selectedCountryId, activeFilters, filterMembersSet, nodeBasePositions]);

            const handleResetZoom = (e) => {
                e.stopPropagation();
                if (!svgRef.current) return;
                d3.select(svgRef.current).transition().duration(450).call(
                    d3.zoom().transform,
                    d3.zoomIdentity
                );
            };

            return (
                <div 
                    className="absolute inset-0 z-10 bg-intel-bg overflow-hidden cursor-move select-none" 
                    onClick={() => { setSelectedCountryId(null); setHoveredCountryId(null); }}
                >
                    <svg ref={svgRef} id="map-svg" width="100%" height="100%" className="absolute inset-0 block">
                        <defs>
                            <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
                                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(20, 40, 71, 0.2)" strokeWidth="1"/>
                            </pattern>
                        </defs>
                        
                        <rect width="100%" height="100%" fill="url(#grid-pattern)" />

                        {/* HARDWARE ACCELERATED ROOT LAYER */}
                        <g ref={zoomGroupRef}>
                            
                            {/* Layer 1: Landmasses (Non-Scaling-Stroke prevents line-width distortion) */}
                            {geoPathStr && (
                                <path 
                                    d={geoPathStr}
                                    fill="#061224"
                                    stroke="#142847"
                                    strokeWidth="0.5"
                                    className="map-vector"
                                />
                            )}

                            {/* Layer 2: Equal Internal Boundaries */}
                            {bordersPathStr && (
                                <path
                                    d={bordersPathStr}
                                    fill="none"
                                    stroke="#1e3a66"
                                    strokeWidth="0.75"
                                    className="map-vector"
                                />
                            )}

                            {/* Layer 3: Relationship & Treaty Arcs */}
                            <g className="arcs-layer">
                                {arcs.map((arc) => (
                                    <g key={arc.id}>
                                        {/* Underlying faint track line */}
                                        <path
                                            d={arc.path}
                                            fill="none"
                                            stroke="#142847"
                                            strokeWidth="1.2"
                                            style={{ opacity: 0.6 }}
                                            className="map-vector"
                                        />
                                        {/* Moving Dotted Cyan Data Flow Pulse */}
                                        <path
                                            d={arc.path}
                                            fill="none"
                                            stroke="#00d2ff"
                                            strokeWidth="2"
                                            className={isAnimActive ? "arc-flow-active" : "arc-flow-static"}
                                            style={{ opacity: 0.95 }}
                                        />
                                    </g>
                                ))}
                            </g>

                            {/* Layer 4: Sovereign Nation Nodes */}
                            <g className="nodes-layer">
                                {globalNations.map(nation => {
                                    const pos = nodeBasePositions.get(nation.iso3);
                                    if (!pos) return null;
                                    
                                    const isSelected = selectedCountryId === nation.iso3;
                                    let isConnected = false;
                                    let isDimmed = false;

                                    if (selectedCountryId) {
                                        isConnected = isSelected || arcs.some(a => a.id.includes(nation.iso3));
                                        isDimmed = !isConnected;
                                    } else if (activeFilters.length > 0) {
                                        isConnected = filterMembersSet.has(nation.iso3);
                                        isDimmed = !isConnected;
                                    }

                                    const visualR = isSelected ? 3.5 : (isConnected ? 2.5 : 1.4);

                                    return (
                                        <g 
                                            key={nation.iso3} 
                                            transform={`translate(${pos.x}, ${pos.y})`}
                                            onClick={(e) => { 
                                                e.stopPropagation(); 
                                                setSelectedCountryId(nation.iso3 === selectedCountryId ? null : nation.iso3);
                                            }}
                                            onMouseEnter={() => setHoveredCountryId(nation.iso3)}
                                            onMouseLeave={() => setHoveredCountryId(null)}
                                            className={`cursor-pointer transition-opacity duration-150 ${isDimmed ? 'opacity-15' : 'opacity-100'}`}
                                        >
                                            {/* CSS Inverse Scaling Group: Keeps hitboxes large while shrinking visuals */}
                                            <g className="node-scaler">
                                                {/* Massive invisible click target ensures easy selection at any zoom */}
                                                <circle r="16" fill="transparent" />

                                                {isSelected && (
                                                    <circle 
                                                        r={visualR * 2.2} 
                                                        fill="rgba(0,210,255,0.15)" 
                                                        stroke="#00d2ff" 
                                                        strokeWidth="0.75" 
                                                    />
                                                )}
                                                
                                                <circle 
                                                    r={visualR} 
                                                    fill={isSelected ? "#00d2ff" : (isConnected ? "#00fa9a" : "#768ba5")} 
                                                />
                                                
                                                <text 
                                                    y={-visualR - 3} 
                                                    textAnchor="middle" 
                                                    fill={isSelected ? "#00d2ff" : (isConnected ? "#00fa9a" : "#64748b")}
                                                    fontSize="5"
                                                    className="font-mono font-bold select-none pointer-events-none"
                                                    style={{ opacity: isSelected || isConnected ? 1 : 0 }}
                                                >
                                                    {nation.iso3}
                                                </text>
                                            </g>
                                        </g>
                                    );
                                })}
                            </g>
                        </g>
                    </svg>

                    <div className="absolute bottom-5 left-4 z-30 flex items-center gap-2 font-mono text-[10px]">
                        <button
                            onClick={handleResetZoom}
                            className="hud-panel px-3 py-1.5 rounded-sm border border-intel-border hover:border-intel-accent text-intel-text hover:text-white transition-colors uppercase tracking-wider"
                        >
                            RESET GLOBAL VIEW
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [isBooting, setIsBooting] = useState(true);

            return (
                <GlobalStateProvider>
                    {isBooting ? (
                        <BootSequence onComplete={() => setIsBooting(false)} />
                    ) : (
                        <>
                            <TopNav />
                            <GlobalTreatyFilter />
                            <CyberTargetReadout />
                            <MapEngine />
                            <IntelligenceSidebar />
                            <SourcesModal />
                        </>
                    )}
                </GlobalStateProvider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
